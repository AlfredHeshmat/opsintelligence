# Self-contained, local-only full stack. Existing compose.yaml remains DB-only.
# Configure .env in repository root. Never use with real company secrets.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [private]
    restart: unless-stopped
  migrate:
    build: ./backend
    command: ["python", "-m", "scripts.container_entrypoint", "migrate"]
    environment: &database_env
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"
  backend:
    build: ./backend
    environment:
      <<: *database_env
      CORS_ORIGINS: '["http://127.0.0.1:8080","http://localhost:8080"]'
      # LOCAL DEMO ONLY. Set false before any public deployment.
      OPS_ENABLE_LOCAL_SIGNUP: ${OPS_ENABLE_LOCAL_SIGNUP:-true}
      OPS_ALLOW_LEGACY_MEMBER_ADD: ${OPS_ALLOW_LEGACY_MEMBER_ADD:-false}
      OPS_READONLY_CONNECTORS_ENABLED: ${OPS_READONLY_CONNECTORS_ENABLED:-false}
      OPS_PG_CONNECTOR_BINDINGS_JSON: ${OPS_PG_CONNECTOR_BINDINGS_JSON:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${OPS_FRONTEND_PORT:-8080}:8080'
    depends_on:
      backend:
        condition: service_healthy
    networks: [private]
    restart: unless-stopped
networks:
  private:
    internal: false
volumes:
  postgres_data: {}

